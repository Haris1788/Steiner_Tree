<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    MST vs Steiner Tree Comparison
  </text>
  
  <!-- Left: MST -->
  <text x="200" y="70" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">
    MST (Simpler, Fast)
  </text>
  
  <!-- Required nodes -->
  <circle cx="100" cy="140" r="13" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="80" y="145" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">R₁</text>
  
  <circle cx="300" cy="140" r="13" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="320" y="145" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">R₂</text>
  
  <circle cx="100" cy="280" r="13" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="80" y="285" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">R₃</text>
  
  <circle cx="300" cy="280" r="13" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="320" y="285" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">R₄</text>
  
  <circle cx="200" cy="140" r="13" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="200" y="125" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">R₅</text>
  
  <!-- MST edges (longer paths) -->
  <line x1="113" y1="140" x2="187" y2="140" stroke="#6366f1" stroke-width="4"/>
  <line x1="213" y1="140" x2="287" y2="140" stroke="#6366f1" stroke-width="4"/>
  <line x1="100" y1="153" x2="100" y2="267" stroke="#6366f1" stroke-width="4"/>
  <line x1="100" y1="267" x2="287" y2="280" stroke="#6366f1" stroke-width="4"/>
  
  <!-- Cost box -->
  <rect x="80" y="320" width="240" height="100" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" rx="5"/>
  <text x="200" y="345" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#312e81">
    MST Properties:
  </text>
  <text x="200" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="#3730a3">
    • Only uses required vertices
  </text>
  <text x="200" y="383" font-family="Arial" font-size="12" text-anchor="middle" fill="#3730a3">
    • May be longer paths
  </text>
  <text x="200" y="401" font-family="Arial" font-size="12" text-anchor="middle" fill="#3730a3">
    • Cost ≤ 2 · OPT
  </text>
  
  <!-- Comparison arrow -->
  <defs>
    <marker id="arrow7" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280" />
    </marker>
  </defs>
  <text x="400" y="210" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b7280">
    vs
  </text>
  
  <!-- Right: Steiner Tree -->
  <text x="600" y="70" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">
    Steiner Tree (Optimal, Complex)
  </text>
  
  <!-- Required nodes -->
  <circle cx="500" cy="140" r="13" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="480" y="145" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">R₁</text>
  
  <circle cx="700" cy="140" r="13" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="720" y="145" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">R₂</text>
  
  <circle cx="500" cy="280" r="13" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="480" y="285" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">R₃</text>
  
  <circle cx="700" cy="280" r="13" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="720" y="285" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">R₄</text>
  
  <circle cx="600" cy="140" r="13" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="600" y="125" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">R₅</text>
  
  <!-- Steiner points (extra points for optimization) -->
  <circle cx="550" cy="200" r="11" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <text x="575" y="205" font-family="Arial" font-size="10" font-weight="bold" fill="#92400e">S₁</text>
  
  <circle cx="650" cy="200" r="11" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <text x="675" y="205" font-family="Arial" font-size="10" font-weight="bold" fill="#92400e">S₂</text>
  
  <!-- Steiner tree edges (shorter total cost) -->
  <line x1="508" y1="147" x2="543" y2="193" stroke="#22c55e" stroke-width="4"/>
  <line x1="557" y1="193" x2="592" y2="147" stroke="#22c55e" stroke-width="4"/>
  <line x1="608" y1="147" x2="643" y2="193" stroke="#22c55e" stroke-width="4"/>
  <line x1="657" y1="193" x2="692" y2="147" stroke="#22c55e" stroke-width="4"/>
  <line x1="550" y1="211" x2="650" y2="211" stroke="#22c55e" stroke-width="4"/>
  <line x1="508" y1="273" x2="543" y2="207" stroke="#22c55e" stroke-width="4"/>
  <line x1="657" y1="207" x2="692" y2="273" stroke="#22c55e" stroke-width="4"/>
  
  <!-- Cost box -->
  <rect x="480" y="320" width="240" height="100" fill="#d1fae5" stroke="#22c55e" stroke-width="2" rx="5"/>
  <text x="600" y="345" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">
    Steiner Tree Properties:
  </text>
  <text x="600" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="#15803d">
    • Uses Steiner vertices
  </text>
  <text x="600" y="383" font-family="Arial" font-size="12" text-anchor="middle" fill="#15803d">
    • Shorter total paths
  </text>
  <text x="600" y="401" font-family="Arial" font-size="12" text-anchor="middle" fill="#15803d">
    • Cost = OPT (but NP-hard)
  </text>
</svg>
