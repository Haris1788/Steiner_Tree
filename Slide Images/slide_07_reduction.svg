<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
    <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Approximation-Factor Preserving Reduction
  </text>
  
  <!-- General Problem Box -->
  <rect x="30" y="100" width="200" height="120" fill="#fecaca" stroke="#dc2626" stroke-width="3" rx="10"/>
  <text x="130" y="140" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#7f1d1d">
    General Problem
  </text>
  <text x="130" y="170" font-family="Arial" font-size="14" text-anchor="middle" fill="#7f1d1d">
    Steiner Tree
  </text>
  <text x="130" y="190" font-family="Arial" font-size="13" text-anchor="middle" fill="#991b1b">
    (Any Graph)
  </text>
  
  <!-- Arrow 1: General to Reduction -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1e40af" />
    </marker>
  </defs>
  
  <line x1="230" y1="160" x2="290" y2="160" stroke="#1e40af" stroke-width="4" marker-end="url(#arrowhead)"/>
  
  <!-- Reduction Box -->
  <rect x="290" y="100" width="200" height="120" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3" rx="10"/>
  <text x="390" y="140" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#312e81">
    Reduction
  </text>
  <text x="390" y="170" font-family="Arial" font-size="14" text-anchor="middle" fill="#3730a3">
    Apply
  </text>
  <text x="390" y="190" font-family="Arial" font-size="14" text-anchor="middle" fill="#3730a3">
    Triangle Inequality
  </text>
  
  <!-- Arrow 2: Reduction to Metric Problem -->
  <line x1="490" y1="160" x2="550" y2="160" stroke="#1e40af" stroke-width="4" marker-end="url(#arrowhead)"/>
  
  <!-- Metric Problem Box -->
  <rect x="550" y="100" width="220" height="120" fill="#bbf7d0" stroke="#16a34a" stroke-width="3" rx="10"/>
  <text x="660" y="140" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#14532d">
    Metric Problem
  </text>
  <text x="660" y="170" font-family="Arial" font-size="14" text-anchor="middle" fill="#166534">
    Metric Steiner Tree
  </text>
  <text x="660" y="190" font-family="Arial" font-size="13" text-anchor="middle" fill="#15803d">
    (Complete + Triangle Ineq.)
  </text>
  
  <!-- Bottom note -->
  <rect x="150" y="240" width="500" height="45" fill="#fff7ed" stroke="#f97316" stroke-width="2" rx="8"/>
  <text x="400" y="260" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#7c2d12">
    Approximation Factor Preserved:
  </text>
  <text x="400" y="278" font-family="Arial" font-size="13" text-anchor="middle" fill="#9a3412">
    Quality of solution remains the same after reduction
  </text>
</svg>
