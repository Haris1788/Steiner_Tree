<svg width="700" height="560" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560">
  <!-- Title -->
  <text x="350" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Star Graph: Tight Example for Factor 2
  </text>

  <!-- Center Steiner node -->
  <circle cx="350" cy="220" r="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="3"/>
  <text x="350" y="203" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400e">
    Steiner Center
  </text>

  <!-- Required vertices on circle (n=6 example) -->
  <circle cx="350" cy="100" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="350" y="85" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">R&#x2081;</text>

  <circle cx="454" cy="160" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="480" y="165" font-family="Arial" font-size="12" font-weight="bold" fill="#1e40af">R&#x2082;</text>

  <circle cx="454" cy="280" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="480" y="285" font-family="Arial" font-size="12" font-weight="bold" fill="#1e40af">R&#x2083;</text>

  <circle cx="350" cy="340" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="350" y="365" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">R&#x2084;</text>

  <circle cx="246" cy="280" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="216" y="285" font-family="Arial" font-size="12" font-weight="bold" fill="#1e40af">R&#x2085;</text>

  <circle cx="246" cy="160" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="216" y="165" font-family="Arial" font-size="12" font-weight="bold" fill="#1e40af">R&#x2086;</text>

  <!-- OPT: Star connections (red, from center to each) -->
  <line x1="350" y1="208" x2="350" y2="114" stroke="#ef4444" stroke-width="3" opacity="0.7"/>
  <line x1="360" y1="215" x2="440" y2="167" stroke="#ef4444" stroke-width="3" opacity="0.7"/>
  <line x1="360" y1="225" x2="440" y2="273" stroke="#ef4444" stroke-width="3" opacity="0.7"/>
  <line x1="350" y1="232" x2="350" y2="326" stroke="#ef4444" stroke-width="3" opacity="0.7"/>
  <line x1="340" y1="225" x2="260" y2="273" stroke="#ef4444" stroke-width="3" opacity="0.7"/>
  <line x1="340" y1="215" x2="260" y2="167" stroke="#ef4444" stroke-width="3" opacity="0.7"/>

  <!-- Edge labels (cost = 1 each) -->
  <text x="340" y="165" font-family="Arial" font-size="10" fill="#dc2626" font-weight="bold">1</text>
  <text x="405" y="185" font-family="Arial" font-size="10" fill="#dc2626" font-weight="bold">1</text>
  <text x="405" y="255" font-family="Arial" font-size="10" fill="#dc2626" font-weight="bold">1</text>
  <text x="340" y="285" font-family="Arial" font-size="10" fill="#dc2626" font-weight="bold">1</text>
  <text x="285" y="255" font-family="Arial" font-size="10" fill="#dc2626" font-weight="bold">1</text>
  <text x="285" y="185" font-family="Arial" font-size="10" fill="#dc2626" font-weight="bold">1</text>

  <!-- MST: Perimeter connections (green arcs, avoiding center) -->
  <path d="M 350 114 A 120 120 0 0 1 440 167" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.8"/>
  <path d="M 440 167 A 120 120 0 0 1 440 273" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.8"/>
  <path d="M 440 273 A 120 120 0 0 1 350 326" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.8"/>
  <path d="M 350 326 A 120 120 0 0 1 260 273" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.8"/>
  <path d="M 260 273 A 120 120 0 0 1 260 167" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.8"/>

  <!-- MST perimeter edge labels (cost = 2 each) -->
  <text x="405" y="138" font-family="Arial" font-size="10" fill="#16a34a" font-weight="bold">2</text>
  <text x="458" y="220" font-family="Arial" font-size="10" fill="#16a34a" font-weight="bold">2</text>
  <text x="405" y="308" font-family="Arial" font-size="10" fill="#16a34a" font-weight="bold">2</text>
  <text x="285" y="308" font-family="Arial" font-size="10" fill="#16a34a" font-weight="bold">2</text>
  <text x="228" y="220" font-family="Arial" font-size="10" fill="#16a34a" font-weight="bold">2</text>

  <!-- BOTTOM SECTION: Legends side-by-side, then ratio below -->
  <!-- Legend: Optimal -->
  <rect x="40" y="390" width="290" height="55" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="6"/>
  <line x1="55" y1="412" x2="90" y2="412" stroke="#ef4444" stroke-width="3"/>
  <text x="100" y="417" font-family="Arial" font-size="13" fill="#7f1d1d" font-weight="bold">
    Optimal Steiner Tree (OPT)
  </text>
  <text x="100" y="436" font-family="Arial" font-size="12" fill="#991b1b">
    n=6 terminals, cost = n = 6
  </text>

  <!-- Legend: MST -->
  <rect x="370" y="390" width="290" height="55" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="6"/>
  <line x1="385" y1="412" x2="420" y2="412" stroke="#22c55e" stroke-width="4"/>
  <text x="430" y="417" font-family="Arial" font-size="13" fill="#14532d" font-weight="bold">
    MST on Required Vertices
  </text>
  <text x="430" y="436" font-family="Arial" font-size="12" fill="#15803d">
    Perimeter path, cost = 2(n-1) = 10
  </text>

  <!-- Ratio box (clearly below legends) -->
  <rect x="100" y="465" width="500" height="80" fill="#fffbeb" stroke="#f59e0b" stroke-width="3" rx="10"/>
  <text x="350" y="495" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#92400e">
    Ratio = MST / OPT = 2(n-1) / n
  </text>
  <text x="350" y="520" font-family="Arial" font-size="14" text-anchor="middle" fill="#78350f">
    For n=6:  10/6 &#x2248; 1.67      As n &#x2192; &#x221E;:  ratio &#x2192; 2
  </text>
  <text x="350" y="538" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#a16207">
    This proves factor 2 is tight (Example 3.4, Vazirani)
  </text>
</svg>
