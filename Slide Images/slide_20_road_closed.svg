<svg width="500" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
    <!-- Title -->
  <text x="250" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    General TSP: Road Closed!
  </text>
  
  <!-- Road sign pole -->
  <rect x="235" y="350" width="30" height="120" fill="#64748b" stroke="#475569" stroke-width="2"/>
  
  <!-- Octagonal stop sign shape -->
  <path d="M 180 140 L 250 100 L 320 140 L 360 210 L 320 280 L 250 320 L 180 280 L 140 210 Z" 
        fill="#dc2626" stroke="#991b1b" stroke-width="4"/>
  
  <!-- Inner white border -->
  <path d="M 190 150 L 250 115 L 310 150 L 345 210 L 310 270 L 250 305 L 190 270 L 155 210 Z" 
        fill="none" stroke="#ffffff" stroke-width="6"/>
  
  <!-- X symbol (road closed) -->
  <line x1="190" y1="160" x2="310" y2="260" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <line x1="310" y1="160" x2="190" y2="260" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Text on sign -->
  <text x="250" y="195" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">
    ROAD
  </text>
  <text x="250" y="235" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">
    CLOSED
  </text>
  
  <!-- Bottom text -->
  <text x="250" y="390" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">
    No Approximation
  </text>
  <text x="250" y="410" font-family="Arial" font-size="13" text-anchor="middle" fill="#991b1b">
    for General TSP
  </text>
  <text x="250" y="430" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f1d1d">
    (unless P = NP)
 </text>
  
  <!-- Explanation box -->
  <rect x="50" y="445" width="400" height="45" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="250" y="465" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f1d1d">
    Cannot be approximated within any factor α(n)
  </text>
  <text x="250" y="482" font-family="Arial" font-size="11" text-anchor="middle" fill="#991b1b">
    Even factor 100 or 1,000,000 is impossible to guarantee!
  </text>
</svg>
