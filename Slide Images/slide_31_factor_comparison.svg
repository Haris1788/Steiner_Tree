<svg width="700" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <!-- Title -->
  <text x="350" y="30" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e40af">
    TSP Approximation Factors Comparison
  </text>
  
  <!-- Y-axis -->
  <line x1="100" y1="100" x2="100" y2="350" stroke="#374151" stroke-width="3"/>
  <defs>
    <marker id="arrowY" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 5, 10 2, 10 8" fill="#374151"/>
    </marker>
  </defs>
  <line x1="100" y1="100" x2="100" y2="85" stroke="#374151" stroke-width="3" marker-end="url(#arrowY)"/>
  
  <text x="60" y="95" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">Cost</text>
  <text x="60" y="110" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">Ratio</text>
  
  <!-- Y-axis labels -->
  <line x1="95" y1="350" x2="105" y2="350" stroke="#374151" stroke-width="2"/>
  <text x="80" y="355" font-family="Arial" font-size="12" text-anchor="end" fill="#374151">0.0</text>
  
  <line x1="95" y1="300" x2="105" y2="300" stroke="#374151" stroke-width="2"/>
  <text x="80" y="305" font-family="Arial" font-size="12" text-anchor="end" fill="#374151">0.5</text>
  
  <line x1="95" y1="250" x2="105" y2="250" stroke="#374151" stroke-width="2"/>
  <text x="80" y="255" font-family="Arial" font-size="12" text-anchor="end" fill="#374151">1.0</text>
  
  <line x1="95" y1="200" x2="105" y2="200" stroke="#374151" stroke-width="2"/>
  <text x="80" y="205" font-family="Arial" font-size="12" text-anchor="end" fill="#374151">1.5</text>
  
  <line x1="95" y1="150" x2="105" y2="150" stroke="#374151" stroke-width="2"/>
  <text x="80" y="155" font-family="Arial" font-size="12" text-anchor="end" fill="#374151">2.0</text>
  
  <!-- X-axis -->
  <line x1="100" y1="350" x2="650" y2="350" stroke="#374151" stroke-width="3"/>
  
  <!-- Bar 1: OPT (1.0) -->
  <rect x="150" y="250" width="120" height="100" fill="#22c55e" stroke="#16a34a" stroke-width="3" rx="5"/>
  <text x="210" y="305" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="white">1.0</text>
  <text x="210" y="375" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">OPT</text>
  <text x="210" y="395" font-family="Arial" font-size="11" text-anchor="middle" fill="#6b7280">(Optimal TSP)</text>
  
  <!-- Bar 2: Christofides (1.5) -->
  <rect x="310" y="200" width="120" height="150" fill="#fbbf24" stroke="#f59e0b" stroke-width="3" rx="5"/>
  <text x="370" y="280" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="white">1.5</text>
  <text x="370" y="375" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">Christofides</text>
  <text x="370" y="395" font-family="Arial" font-size="11" text-anchor="middle" fill="#6b7280">(Best known)</text>
  
  <!-- Bar 3: MST Doubling (2.0) -->
  <rect x="470" y="150" width="120" height="200" fill="#ef4444" stroke="#dc2626" stroke-width="3" rx="5"/>
  <text x="530" y="255" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="white">2.0</text>
  <text x="530" y="375" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">MST Doubling</text>
  <text x="530" y="395" font-family="Arial" font-size="11" text-anchor="middle" fill="#6b7280">(Simple algorithm)</text>
  
  <!-- Comparison annotations -->
  <defs>
    <marker id="arrowComp" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
    </marker>
  </defs>
  
  <!-- Arrow from OPT to Christofides -->
  <line x1="270" y1="220" x2="305" y2="220" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowComp)"/>
  <text x="287" y="215" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#92400e">+50%</text>
  
  <!-- Arrow from Christofides to MST -->
  <line x1="430" y1="175" x2="465" y2="175" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowComp)"/>
  <text x="447" y="170" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#7f1d1d">+33%</text>
  
  <!-- Summary box -->
  <rect x="50" y="415" width="600" height="25" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="5"/>
  <text x="350" y="433" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Christofides gives 3/2-approximation: 33% better than simple MST doubling
  </text>
</svg>
