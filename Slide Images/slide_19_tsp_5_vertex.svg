<svg width="500" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
    <!-- Title -->
  <text x="250" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    TSP: 5 Vertices Example
  </text>
  
  <!-- Pentagon vertices -->
  <circle cx="250" cy="100" r="16" fill="#3b82f6" stroke="#1e40af" stroke-width="3"/>
  <text x="250" y="108" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
  <text x="250" y="80" font-family="Arial" font-size="13" text-anchor="middle" fill="#1e40af">Vertex 1</text>
  
  <circle cx="400" cy="200" r="16" fill="#3b82f6" stroke="#1e40af" stroke-width="3"/>
  <text x="400" y="208" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
  <text x="440" y="208" font-family="Arial" font-size="13" fill="#1e40af">Vertex 2</text>
  
  <circle cx="350" cy="360" r="16" fill="#3b82f6" stroke="#1e40af" stroke-width="3"/>
  <text x="350" y="368" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
  <text x="390" y="370" font-family="Arial" font-size="13" fill="#1e40af">Vertex 3</text>
  
  <circle cx="150" cy="360" r="16" fill="#3b82f6" stroke="#1e40af" stroke-width="3"/>
  <text x="150" y="368" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
  <text x="110" y="370" font-family="Arial" font-size="13" text-anchor="end" fill="#1e40af">Vertex 4</text>
  
  <circle cx="100" cy="200" r="16" fill="#3b82f6" stroke="#1e40af" stroke-width="3"/>
  <text x="100" y="208" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
  <text x="60" y="208" font-family="Arial" font-size="13" text-anchor="end" fill="#1e40af">Vertex 5</text>
  
  <!-- Tour edges with arrows -->
  <defs>
    <marker id="arrowTour" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#22c55e" />
    </marker>
  </defs>
  
  <!-- 1 -> 2 -->
  <path d="M 265 110 L 385 190" fill="none" stroke="#22c55e" stroke-width="5" marker-end="url(#arrowTour)"/>
  <text x="330" y="145" font-family="Arial" font-size="12" fill="#16a34a" font-weight="bold">1→2</text>
  
  <!-- 2 -> 3 -->
  <path d="M 395 216 L 355 344" fill="none" stroke="#22c55e" stroke-width="5" marker-end="url(#arrowTour)"/>
  <text x="390" y="285" font-family="Arial" font-size="12" fill="#16a34a" font-weight="bold">2→3</text>
  
  <!-- 3 -> 4 -->
  <path d="M 334 360 L 166 360" fill="none" stroke="#22c55e" stroke-width="5" marker-end="url(#arrowTour)"/>
  <text x="250" y="380" font-family="Arial" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="bold">3→4</text>
  
  <!-- 4 -> 5 -->
  <path d="M 140 348 L 110 212" fill="none" stroke="#22c55e" stroke-width="5" marker-end="url(#arrowTour)"/>
  <text x="110" y="285" font-family="Arial" font-size="12" fill="#16a34a" font-weight="bold">4→5</text>
  
  <!-- 5 -> 1 -->
  <path d="M 110 184 L 238 110" fill="none" stroke="#22c55e" stroke-width="5" marker-end="url(#arrowTour)"/>
  <text x="165" y="145" font-family="Arial" font-size="12" fill="#16a34a" font-weight="bold">5→1</text>
  
  <!-- Description box -->
  <rect x="50" y="420" width="400" height="65" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="8"/>
  <text x="250" y="443" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">
    One Possible Tour
  </text>
  <text x="250" y="462" font-family="Arial" font-size="13" text-anchor="middle" fill="#15803d">
    1 → 2 → 3 → 4 → 5 → 1
  </text>
  <text x="250" y="479" font-family="Arial" font-size="12" text-anchor="middle" fill="#15803d">
    (Visits each vertex exactly once, returns to start)
  </text>
</svg>
