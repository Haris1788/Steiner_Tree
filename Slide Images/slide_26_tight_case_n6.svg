<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Tight Example: Factor 2 is Achieved (n=6 TSP)
  </text>
  
  <!-- MST Section -->
  <text x="150" y="70" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">
    MST Structure (Star)
  </text>
  
  <!-- Center -->
  <circle cx="150" cy="180" r="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <text x="150" y="186" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#78350f">c</text>
  
  <!-- 6 vertices around center -->
  <circle cx="150" cy="110" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="150" y="115" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">1</text>
  
  <circle cx="230" cy="140" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="230" y="145" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">2</text>
  
  <circle cx="230" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="230" y="225" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">3</text>
  
  <circle cx="150" cy="250" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="150" y="255" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">4</text>
  
  <circle cx="70" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="70" y="225" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">5</text>
  
  <circle cx="70" cy="140" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="70" y="145" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">6</text>
  
  <!-- MST edges (star) -->
  <line x1="150" y1="168" x2="150" y2="122" stroke="#22c55e" stroke-width="3"/>
  <line x1="162" y1="173" x2="220" y2="145" stroke="#22c55e" stroke-width="3"/>
  <line x1="162" y1="187" x2="220" y2="215" stroke="#22c55e" stroke-width="3"/>
  <line x1="150" y1="192" x2="150" y2="238" stroke="#22c55e" stroke-width="3"/>
  <line x1="138" y1="187" x2="80" y2="215" stroke="#22c55e" stroke-width="3"/>
  <line x1="138" y1="173" x2="80" y2="145" stroke="#22c55e" stroke-width="3"/>
  
  <rect x="70" y="275" width="160" height="35" fill="#d1fae5" stroke="#22c55e" stroke-width="2" rx="4"/>
  <text x="150" y="295" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">
    MST Cost = 6
  </text>
  <text x="150" y="307" font-family="Arial" font-size="10" text-anchor="middle" fill="#15803d">
    (6 edges, each cost 1)
  </text>
  
  <!-- Algorithm Tour -->
  <text x="450" y="70" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">
    Algorithm's Tour
  </text>
  
  <!-- Same 6 vertices -->
  <circle cx="450" cy="110" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="450" y="115" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">1</text>
  
  <circle cx="530" cy="140" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="530" y="145" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">2</text>
  
  <circle cx="530" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="530" y="225" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">3</text>
  
  <circle cx="450" cy="250" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="450" y="255" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">4</text>
  
  <circle cx="370" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="370" y="225" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">5</text>
  
  <circle cx="370" cy="140" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="370" y="145" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">6</text>
  
  <!-- Tour around perimeter (shortcut tour) -->
  <defs>
    <marker id="arrowTight" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>
  <path d="M 450 120 L 530 140" stroke="#ef4444" stroke-width="4" fill="none" marker-end="url(#arrowTight)"/>
  <path d="M 530 150 L 530 210" stroke="#ef4444" stroke-width="4" fill="none" marker-end="url(#arrowTight)"/>
  <path d="M 520 220 L 460 245" stroke="#ef4444" stroke-width="4" fill="none" marker-end="url(#arrowTight)"/>
  <path d="M 450 240 L 380 220" stroke="#ef4444" stroke-width="4" fill="none" marker-end="url(#arrowTight)"/>
  <path d="M 370 210 L 370 150" stroke="#ef4444" stroke-width="4" fill="none" marker-end="url(#arrowTight)"/>
  <path d="M 380 140 L 440 115" stroke="#ef4444" stroke-width="4" fill="none" marker-end="url(#arrowTight)"/>
  
  <rect x="370" y="275" width="160" height="35" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="4"/>
  <text x="450" y="295" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f1d1d">
    Tour Cost = 12
  </text>
  <text x="450" y="307" font-family="Arial" font-size="10" text-anchor="middle" fill="#991b1b">
    (6 long edges, each cost 2)
  </text>
  
  <!-- Analysis -->
  <rect x="50" y="335" width="500" height="145" fill="#fffbeb" stroke="#f59e0b" stroke-width="3" rx="10"/>
  <text x="300" y="365" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e">
    Tight Example Analysis
  </text>
  
  <text x="80" y="395" font-family="Arial" font-size="13" fill="#78350f">
    • <tspan font-weight="bold">Optimal TSP Tour:</tspan> Perimeter (1→2→3→4→5→6→1), cost = 6
  </text>
  
  <text x="80" y="420" font-family="Arial" font-size="13" fill="#78350f">
    • <tspan font-weight="bold">Our Algorithm:</tspan> MST (star), doubled and shortcut → perimeter, cost = 12
  </text>
  
  <text x="80" y="445" font-family="Arial" font-size="13" fill="#78350f">
    • <tspan font-weight="bold">Ratio:</tspan> 12 / 6 = 2.0 exactly
  </text>
  
  <text x="300" y="470" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">
    ⚠ This shows the approximation factor 2 is tight (cannot improve)
  </text>
</svg>
