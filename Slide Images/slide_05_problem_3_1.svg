<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Problem 3.1: Steiner Tree
  </text>
  
  <!-- Left: Input Graph -->
  <text x="200" y="70" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">
    Input Graph
  </text>
  
  <!-- Vertices -->
  <circle cx="100" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="75" y="155" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">T₁</text>
  
  <circle cx="300" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="325" y="155" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">T₂</text>
  
  <circle cx="100" cy="300" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="75" y="305" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">T₃</text>
  
  <circle cx="300" cy="300" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="325" y="305" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">T₄</text>
  
  <!-- Steiner vertices (optional) -->
  <circle cx="200" cy="150" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="200" y="135" font-family="Arial" font-size="10" text-anchor="middle" fill="#475569">S₁</text>
  
  <circle cx="200" cy="300" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="200" y="330" font-family="Arial" font-size="10" text-anchor="middle" fill="#475569">S₂</text>
  
  <circle cx="200" cy="225" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="235" y="228" font-family="Arial" font-size="10" fill="#475569">S₃</text>
  
  <!-- All possible edges -->
  <line x1="112" y1="150" x2="188" y2="150" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="212" y1="150" x2="288" y2="150" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="100" y1="162" x2="100" y2="288" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="300" y1="162" x2="300" y2="288" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="110" y1="160" x2="190" y2="217" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="210" y1="217" x2="290" y2="160" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="110" y1="290" x2="190" y2="233" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="210" y1="233" x2="290" y2="290" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="200" y1="162" x2="200" y2="213" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="200" y1="237" x2="200" y2="288" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Legend -->
  <circle cx="150" cy="360" r="8" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="165" y="365" font-family="Arial" font-size="12" fill="#1e40af">Required (Terminals)</text>
  
  <circle cx="150" cy="380" r="6" fill="#e2e8f0" stroke="#64748b" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="165" y="385" font-family="Arial" font-size="12" fill="#64748b">Steiner (Optional)</text>
  
  <!-- Arrow -->
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280" />
    </marker>
  </defs>
  <line x1="350" y1="225" x2="430" y2="225" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow3)"/>
  
  <!-- Right: Steiner Tree Solution -->
  <text x="600" y="70" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">
    Optimal Steiner Tree
  </text>
  
  <!-- Terminals (same positions) -->
  <circle cx="500" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="475" y="155" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">T₁</text>
  
  <circle cx="700" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="725" y="155" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">T₂</text>
  
  <circle cx="500" cy="300" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="475" y="305" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">T₃</text>
  
  <circle cx="700" cy="300" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="725" y="305" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">T₄</text>
  
  <!-- Selected Steiner vertex -->
  <circle cx="600" cy="225" r="10" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <text x="635" y="228" font-family="Arial" font-size="10" fill="#92400e" font-weight="bold">S₃</text>
  
  <!-- Solution edges (in green) -->
  <line x1="508" y1="155" x2="592" y2="220" stroke="#22c55e" stroke-width="4"/>
  <line x1="608" y1="220" x2="692" y2="155" stroke="#22c55e" stroke-width="4"/>
  <line x1="508" y1="295" x2="592" y2="230" stroke="#22c55e" stroke-width="4"/>
  <line x1="608" y1="230" x2="692" y2="295" stroke="#22c55e" stroke-width="4"/>
  
  <!-- Cost label -->
  <rect x="520" y="345" width="160" height="30" fill="#d1fae5" stroke="#22c55e" stroke-width="2" rx="5"/>
  <text x="600" y="365" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#065f46">
    Minimum Cost Tree
  </text>
</svg>
