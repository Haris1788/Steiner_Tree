<svg width="700" height="350" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
    <!-- Title -->
  <text x="350" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Metric Closure: From Winding Path to Direct Edge
  </text>
  
  <!-- Left: Original Graph G -->
  <text x="180" y="70" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">
    Graph G (Original)
  </text>
  
  <!-- Vertices A and B -->
  <circle cx="80" cy="180" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="80" y="210" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">A</text>
  
  <circle cx="280" cy="180" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="280" y="210" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">B</text>
  
  <!-- Intermediate vertices (winding path) -->
  <circle cx="130" cy="130" r="8" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <circle cx="180" cy="150" r="8" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <circle cx="230" cy="130" r="8" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  
  <!-- Winding path (red) -->
  <polyline points="94,180 130,130 180,150 230,130 266,180" 
            fill="none" stroke="#ef4444" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Cost label -->
  <text x="180" y="240" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">
    Shortest path cost = 10
  </text>
  
  <rect x="50" y="270" width="260" height="60" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="5"/>
  <text x="180" y="293" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f1d1d">
    Path through intermediate
  </text>
  <text x="180" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f1d1d">
    vertices (may be long and
  </text>
  <text x="180" y="327" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f1d1d">
    complex)
  </text>
  
  <!-- Arrow -->
  <defs>
    <marker id="arrow5" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 12 3, 0 6" fill="#059669" />
    </marker>
  </defs>
  <line x1="340" y1="180" x2="390" y2="180" stroke="#059669" stroke-width="4" marker-end="url(#arrow5)"/>
  <text x="365" y="170" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#059669">
    Reduce
  </text>
  
  <!-- Right: Metric Closure G' -->
  <text x="520" y="70" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">
    Metric Closure G'
  </text>
  
  <!-- Vertices A and B -->
  <circle cx="420" cy="180" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="420" y="210" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">A</text>
  
  <circle cx="620" cy="180" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="620" y="210" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">B</text>
  
  <!-- Direct edge (green) -->
  <line x1="434" y1="180" x2="606" y2="180" stroke="#22c55e" stroke-width="5"/>
  
  <!-- Cost label on edge -->
  <rect x="490" y="155" width="60" height="24" fill="#ffffff" stroke="#22c55e" stroke-width="2" rx="4"/>
  <text x="520" y="172" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#16a34a">
    cost = 10
  </text>
  
  <!-- Description -->
  <text x="520" y="240" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#16a34a">
    Direct edge with shortest path cost
  </text>
  
  <rect x="390" y="270" width="260" height="60" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="5"/>
  <text x="520" y="293" font-family="Arial" font-size="12" text-anchor="middle" fill="#14532d">
    Complete graph where
  </text>
  <text x="520" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#14532d">
    edge (A,B) = shortest path
  </text>
  <text x="520" y="327" font-family="Arial" font-size="12" text-anchor="middle" fill="#14532d">
    distance in original graph
  </text>
</svg>
