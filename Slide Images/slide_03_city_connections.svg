<svg width="800" height="350" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    City Connections Example
  </text>
  
  <!-- Left side: Direct connections -->
  <text x="200" y="70" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">
    Cities Connecting Directly
  </text>
  
  <!-- Cities (direct) -->
  <circle cx="100" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="100" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e40af">City A</text>
  
  <circle cx="200" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="200" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e40af">City B</text>
  
  <circle cx="300" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="300" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e40af">City C</text>
  
  <circle cx="150" cy="250" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="150" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e40af">City D</text>
  
  <circle cx="250" cy="250" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="250" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e40af">City E</text>
  
  <!-- Direct connections (expensive) -->
  <line x1="112" y1="150" x2="188" y2="150" stroke="#ef4444" stroke-width="3"/>
  <line x1="212" y1="150" x2="288" y2="150" stroke="#ef4444" stroke-width="3"/>
  <line x1="110" y1="160" x2="145" y2="240" stroke="#ef4444" stroke-width="3"/>
  <line x1="155" y1="240" x2="240" y2="240" stroke="#ef4444" stroke-width="3"/>
  <line x1="260" y1="240" x2="290" y2="160" stroke="#ef4444" stroke-width="3"/>
  
  <text x="200" y="310" font-family="Arial" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">
    Cost: High
  </text>
  
  <!-- Arrow separator -->
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280" />
    </marker>
  </defs>
  <line x1="350" y1="200" x2="430" y2="200" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow2)"/>
  
  <!-- Right side: With junction -->
  <text x="600" y="70" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">
    Cities Connected with Junction
  </text>
  
  <!-- Cities (with junction) -->
  <circle cx="500" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="500" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e40af">City A</text>
  
  <circle cx="600" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="600" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e40af">City B</text>
  
  <circle cx="700" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="700" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e40af">City C</text>
  
  <circle cx="550" cy="250" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="550" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e40af">City D</text>
  
  <circle cx="650" cy="250" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="650" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e40af">City E</text>
  
  <!-- Junction point (Steiner point) -->
  <circle cx="600" cy="200" r="10" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="225" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Junction</text>
  
  <!-- Connections to junction (cheaper) -->
  <line x1="508" y1="155" x2="592" y2="195" stroke="#22c55e" stroke-width="3"/>
  <line x1="592" y1="155" x2="600" y2="190" stroke="#22c55e" stroke-width="3"/>
  <line x1="608" y1="155" x2="692" y2="155" stroke="#22c55e" stroke-width="3"/>
  <line x1="558" y1="245" x2="595" y2="208" stroke="#22c55e" stroke-width="3"/>
  <line x1="645" y1="245" x2="605" y2="208" stroke="#22c55e" stroke-width="3"/>
  
  <text x="600" y="310" font-family="Arial" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">
    Cost: Lower (Using Junction)
  </text>
</svg>
