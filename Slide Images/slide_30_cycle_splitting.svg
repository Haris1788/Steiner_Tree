<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Cycle Splitting: One Cycle → Two Perfect Matchings
  </text>
  
  <!-- Original Cycle -->
  <text x="200" y="80" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">
    Original Cycle (Hamiltonian)
  </text>
  
  <!-- 6 vertices in a cycle -->
  <circle cx="200" cy="130" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="200" y="120" font-family="Arial" font-size="10" font-weight="bold" fill="#1e3a8a">1</text>
  
  <circle cx="280" cy="160" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="295" y="165" font-family="Arial" font-size="10" font-weight="bold" fill="#1e3a8a">2</text>
  
  <circle cx="280" cy="240" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="295" y="245" font-family="Arial" font-size="10" font-weight="bold" fill="#1e3a8a">3</text>
  
  <circle cx="200" cy="270" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="200" y="295" font-family="Arial" font-size="10" font-weight="bold" fill="#1e3a8a">4</text>
  
  <circle cx="120" cy="240" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="105" y="245" font-family="Arial" font-size="10" font-weight="bold" fill="#1e3a8a">5</text>
  
  <circle cx="120" cy="160" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="105" y="165" font-family="Arial" font-size="10" font-weight="bold" fill="#1e3a8a">6</text>
  
  <!-- Alternating colored edges -->
  <line x1="206" y1="140" x2="274" y2="155" stroke="#ef4444" stroke-width="5"/>
  <text x="250" y="140" font-family="Arial" font-size="9" font-weight="bold" fill="#ef4444">Red</text>
  
  <line x1="280" y1="172" x2="280" y2="228" stroke="#3b82f6" stroke-width="5"/>
  <text x="295" y="205" font-family="Arial" font-size="9" font-weight="bold" fill="#3b82f6">Blue</text>
  
  <line x1="274" y1="245" x2="206" y2="265" stroke="#ef4444" stroke-width="5"/>
  <text x="250" y="265" font-family="Arial" font-size="9" font-weight="bold" fill="#ef4444">Red</text>
  
  <line x1="188" y1="270" x2="132" y2="245" stroke="#3b82f6" stroke-width="5"/>
  <text x="150" y="270" font-family="Arial" font-size="9" font-weight="bold" fill="#3b82f6">Blue</text>
  
  <line x1="120" y1="228" x2="120" y2="172" stroke="#ef4444" stroke-width="5"/>
  <text x="105" y="205" font-family="Arial" font-size="9" font-weight="bold" fill="#ef4444">Red</text>
  
  <line x1="132" y1="155" x2="188" y2="135" stroke="#3b82f6" stroke-width="5"/>
  <text x="150" y="135" font-family="Arial" font-size="9" font-weight="bold" fill="#3b82f6">Blue</text>
  
  <text x="200" y="320" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#6b7280">
    Edges alternate: Red-Blue-Red-Blue-Red-Blue
  </text>
  
  <!-- Arrow -->
  <defs>
    <marker id="arrowSplit" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280"/>
    </marker>
  </defs>
  <line x1="330" y1="200" x2="380" y2="200" stroke="#6b7280" stroke-width="3" marker-end="url(#arrowSplit)"/>
  <text x="355" y="190" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">Split</text>
  
  <!-- Matching 1 (Red) -->
  <text x="520" y="120" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ef4444">
    Matching 1 (Red Edges)
  </text>
  
  <circle cx="470" cy="160" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="470" y="153" font-family="Arial" font-size="8" font-weight="bold" fill="#1e3a8a">1</text>
  
  <circle cx="540" cy="160" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="540" y="153" font-family="Arial" font-size="8" font-weight="bold" fill="#1e3a8a">2</text>
  
  <circle cx="570" cy="190" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="570" y="183" font-family="Arial" font-size="8" font-weight="bold" fill="#1e3a8a">3</text>
  
  <circle cx="540" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="540" y="213" font-family="Arial" font-size="8" font-weight="bold" fill="#1e3a8a">4</text>
  
  <circle cx="470" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="470" y="213" font-family="Arial" font-size="8" font-weight="bold" fill="#1e3a8a">5</text>
  
  <circle cx="440" cy="190" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="440" y="183" font-family="Arial" font-size="8" font-weight="bold" fill="#1e3a8a">6</text>
  
  <!-- Red edges only -->
  <line x1="480" y1="160" x2="530" y2="160" stroke="#ef4444" stroke-width="5"/>
  <line x1="560" y1="215" x2="550" y2="225" stroke="#ef4444" stroke-width="5"/>
  <line x1="450" y1="190" x2="460" y2="220" stroke="#ef4444" stroke-width="5"/>
  
  <!-- Matching 2 (Blue) -->
  <text x="680" y="120" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#3b82f6">
    Matching 2 (Blue Edges)
  </text>
  
  <circle cx="630" cy="160" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="630" y="153" font-family="Arial" font-size="8" font-weight="bold" fill="#1e3a8a">1</text>
  
  <circle cx="700" cy="160" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="700" y="153" font-family="Arial" font-size="8" font-weight="bold" fill="#1e3a8a">2</text>
  
  <circle cx="730" cy="190" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="730" y="183" font-family="Arial" font-size="8" font-weight="bold" fill="#1e3a8a">3</text>
  
  <circle cx="700" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="700" y="213" font-family="Arial" font-size="8" font-weight="bold" fill="#1e3a8a">4</text>
  
  <circle cx="630" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="630" y="213" font-family="Arial" font-size="8" font-weight="bold" fill="#1e3a8a">5</text>
  
  <circle cx="600" cy="190" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="600" y="183" font-family="Arial" font-size="8" font-weight="bold" fill="#1e3a8a">6</text>
  
  <!-- Blue edges only -->
  <line x1="710" y1="160" x2="720" y2="190" stroke="#3b82f6" stroke-width="5"/>
  <line x1="690" y1="220" x2="640" y2="220" stroke="#3b82f6" stroke-width="5"/>
  <line x1="610" y1="190" x2="630" y2="170" stroke="#3b82f6" stroke-width="5"/>
  
  <!-- Explanation box -->
  <rect x="50" y="360" width="700" height="70" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="400" y="385" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Key Property: Any cycle with even number of vertices can be split into 2 perfect matchings
  </text>
  <text x="400" y="410" font-family="Arial" font-size="13" text-anchor="middle" fill="#1e3a8a">
    Cost(Cycle) = Cost(Matching 1) + Cost(Matching 2), therefore min matching ≤ Cost(Cycle)/2
  </text>
</svg>
