<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Christofides Algorithm: MST + Perfect Matching
  </text>
  
  <!-- MST Section -->
  <text x="180" y="70" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">
    1. MST
  </text>
  
  <circle cx="130" cy="130" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="230" cy="130" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="130" cy="210" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="230" cy="210" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="180" cy="170" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  
  <line x1="140" y1="130" x2="170" y2="170" stroke="#22c55e" stroke-width="4"/>
  <line x1="190" y1="170" x2="220" y2="130" stroke="#22c55e" stroke-width="4"/>
  <line x1="140" y1="210" x2="170" y2="170" stroke="#22c55e" stroke-width="4"/>
  <line x1="190" y1="170" x2="220" y2="210" stroke="#22c55e" stroke-width="4"/>
  
  <!-- Highlight odd-degree vertices -->
  <circle cx="130" cy="130" r="18" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="3,2"/>
  <circle cx="230" cy="130" r="18" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="3,2"/>
  <circle cx="130" cy="210" r="18" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="3,2"/>
  <circle cx="230" cy="210" r="18" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="3,2"/>
  
  <rect x="90" y="240" width="180" height="30" fill="#d1fae5" stroke="#22c55e" stroke-width="2" rx="4"/>
  <text x="180" y="261" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">
    MST (solid lines)
  </text>
  
  <!-- Plus sign -->
  <text x="310" y="170" font-family="Arial" font-size="40" font-weight="bold" text-anchor="middle" fill="#3b82f6">+</text>
  
  <!-- Matching Section -->
  <text x="450" y="70" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">
    2. Perfect Matching
  </text>
  
  <circle cx="400" cy="130" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="500" cy="130" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="400" cy="210" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="500" cy="210" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="450" cy="170" r="10" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
  
  <!-- Matching edges (dotted) -->
  <line x1="410" y1="130" x2="490" y2="130" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="8,4"/>
  <line x1="410" y1="210" x2="490" y2="210" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="8,4"/>
  
  <!-- Highlight odd-degree vertices -->
  <circle cx="400" cy="130" r="18" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="3,2"/>
  <circle cx="500" cy="130" r="18" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="3,2"/>
  <circle cx="400" cy="210" r="18" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="3,2"/>
  <circle cx="500" cy="210" r="18" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="3,2"/>
  
  <rect x="360" y="240" width="180" height="30" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" rx="4"/>
  <text x="450" y="261" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#5b21b6">
    Matching (dotted lines)
  </text>
  
  <!-- Equals sign -->
  <text x="585" y="170" font-family="Arial" font-size="40" font-weight="bold" text-anchor="middle" fill="#3b82f6">=</text>
  
  <!-- Combined Section -->
  <text x="690" y="70" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">
    3. Eulerian Graph
  </text>
  
  <circle cx="640" cy="130" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="740" cy="130" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="640" cy="210" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="740" cy="210" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="690" cy="170" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  
  <!-- MST edges -->
  <line x1="650" y1="130" x2="680" y2="170" stroke="#22c55e" stroke-width="4"/>
  <line x1="700" y1="170" x2="730" y2="130" stroke="#22c55e" stroke-width="4"/>
  <line x1="650" y1="210" x2="680" y2="170" stroke="#22c55e" stroke-width="4"/>
  <line x1="700" y1="170" x2="730" y2="210" stroke="#22c55e" stroke-width="4"/>
  
  <!-- Matching edges -->
  <line x1="650" y1="130" x2="730" y2="130" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="8,4"/>
  <line x1="650" y1="210" x2="730" y2="210" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="8,4"/>
  
  <rect x="600" y="240" width="180" height="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
  <text x="690" y="261" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">
    All vertices even degree
  </text>
  
  <!-- Algorithm explanation -->
  <rect x="50" y="300" width="700" height="180" fill="#eff6ff" stroke="#3b82f6" stroke-width="3" rx="10"/>
  <text x="400" y="330" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Christofides Algorithm (Factor 3/2)
  </text>
  
  <text x="80" y="365" font-family="Arial" font-size="13" fill="#1e3a8a">
    <tspan font-weight="bold">Step 1:</tspan> Find MST T of the graph (shown in green solid lines)
  </text>
  
  <text x="80" y="395" font-family="Arial" font-size="13" fill="#1e3a8a">
    <tspan font-weight="bold">Step 2:</tspan> Find odd-degree vertices in T (marked with red dashed circles)
  </text>
  
  <text x="80" y="425" font-family="Arial" font-size="13" fill="#1e3a8a">
    <tspan font-weight="bold">Step 3:</tspan> Find minimum-cost perfect matching M on odd-degree vertices (purple dotted lines)
  </text>
  
  <text x="80" y="455" font-family="Arial" font-size="13" fill="#1e3a8a">
    <tspan font-weight="bold">Step 4:</tspan> Combine T ∪ M → Eulerian graph → Find Euler tour → Shortcut to Hamiltonian cycle
  </text>
</svg>
