<svg width="900" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="32" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Algorithm 3.7: Metric TSP &#x2014; Factor 2 Approximation
  </text>

  <!-- ===== STEP 1: Find MST ===== -->
  <rect x="15" y="50" width="195" height="210" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="8"/>
  <rect x="15" y="50" width="195" height="28" fill="#22c55e" rx="8"/>
  <rect x="15" y="65" width="195" height="13" fill="#22c55e"/>
  <text x="112" y="70" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    Step 1: Find MST T
  </text>

  <!-- 5 vertices in star/tree shape -->
  <circle cx="112" cy="120" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="112" y="124" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">A</text>
  <circle cx="55" cy="160" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="55" y="164" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">B</text>
  <circle cx="170" cy="160" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="170" y="164" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">C</text>
  <circle cx="70" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="70" y="224" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">D</text>
  <circle cx="155" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="155" y="224" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">E</text>

  <!-- MST edges (green) -->
  <line x1="105" y1="128" x2="62" y2="153" stroke="#22c55e" stroke-width="4"/>
  <line x1="119" y1="128" x2="163" y2="153" stroke="#22c55e" stroke-width="4"/>
  <line x1="60" y1="168" x2="65" y2="212" stroke="#22c55e" stroke-width="4"/>
  <line x1="165" y1="168" x2="160" y2="212" stroke="#22c55e" stroke-width="4"/>

  <text x="112" y="248" font-family="Arial" font-size="11" text-anchor="middle" fill="#15803d">
    cost(T) &#x2264; OPT
  </text>

  <!-- Arrow 1→2 -->
  <line x1="215" y1="155" x2="240" y2="155" stroke="#6b7280" stroke-width="3" marker-end="url(#arrowGray)"/>

  <!-- ===== STEP 2: Double Every Edge ===== -->
  <rect x="245" y="50" width="195" height="210" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="8"/>
  <rect x="245" y="50" width="195" height="28" fill="#6366f1" rx="8"/>
  <rect x="245" y="65" width="195" height="13" fill="#6366f1"/>
  <text x="342" y="70" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    Step 2: Double Edges
  </text>

  <!-- Same 5 vertices -->
  <circle cx="342" cy="120" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="342" y="124" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">A</text>
  <circle cx="285" cy="160" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="285" y="164" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">B</text>
  <circle cx="400" cy="160" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="400" y="164" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">C</text>
  <circle cx="300" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="300" y="224" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">D</text>
  <circle cx="385" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="385" y="224" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">E</text>

  <!-- Doubled edges: two parallel lines per edge -->
  <line x1="333" y1="127" x2="290" y2="153" stroke="#6366f1" stroke-width="3"/>
  <line x1="337" y1="131" x2="294" y2="157" stroke="#818cf8" stroke-width="3" stroke-dasharray="5,3"/>
  <line x1="351" y1="127" x2="395" y2="153" stroke="#6366f1" stroke-width="3"/>
  <line x1="347" y1="131" x2="391" y2="157" stroke="#818cf8" stroke-width="3" stroke-dasharray="5,3"/>
  <line x1="288" y1="168" x2="297" y2="212" stroke="#6366f1" stroke-width="3"/>
  <line x1="293" y1="169" x2="302" y2="213" stroke="#818cf8" stroke-width="3" stroke-dasharray="5,3"/>
  <line x1="397" y1="168" x2="388" y2="212" stroke="#6366f1" stroke-width="3"/>
  <line x1="392" y1="169" x2="383" y2="213" stroke="#818cf8" stroke-width="3" stroke-dasharray="5,3"/>

  <text x="342" y="248" font-family="Arial" font-size="11" text-anchor="middle" fill="#4338ca">
    All degrees even &#x2192; Eulerian
  </text>

  <!-- Arrow 2→3 -->
  <line x1="445" y1="155" x2="470" y2="155" stroke="#6b7280" stroke-width="3" marker-end="url(#arrowGray)"/>

  <!-- ===== STEP 3: Find Euler Tour ===== -->
  <rect x="475" y="50" width="195" height="210" fill="#fdf4ff" stroke="#a855f7" stroke-width="2" rx="8"/>
  <rect x="475" y="50" width="195" height="28" fill="#a855f7" rx="8"/>
  <rect x="475" y="65" width="195" height="13" fill="#a855f7"/>
  <text x="572" y="70" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    Step 3: Euler Tour
  </text>

  <!-- Same 5 vertices -->
  <circle cx="572" cy="120" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="572" y="124" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">A</text>
  <circle cx="515" cy="160" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="515" y="164" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">B</text>
  <circle cx="630" cy="160" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="630" y="164" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">C</text>
  <circle cx="530" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="530" y="224" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">D</text>
  <circle cx="615" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="615" y="224" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">E</text>

  <!-- Euler tour path: A→B→D→B→A→C→E→C→A with arrows -->
  <!-- Traversal order shown as numbered purple path -->
  <line x1="565" y1="128" x2="522" y2="153" stroke="#a855f7" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="519" y1="168" x2="526" y2="212" stroke="#a855f7" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="534" y1="212" x2="521" y2="168" stroke="#c084fc" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrowGray)"/>
  <line x1="522" y1="153" x2="565" y2="128" stroke="#c084fc" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrowGray)"/>
  <line x1="579" y1="128" x2="623" y2="153" stroke="#a855f7" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="626" y1="168" x2="619" y2="212" stroke="#a855f7" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="611" y1="212" x2="624" y2="168" stroke="#c084fc" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrowGray)"/>
  <line x1="623" y1="153" x2="579" y2="128" stroke="#c084fc" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrowGray)"/>

  <text x="572" y="248" font-family="Arial" font-size="11" text-anchor="middle" fill="#7e22ce">
    Visit every edge exactly once
  </text>

  <!-- Arrow 3→4 -->
  <line x1="675" y1="155" x2="700" y2="155" stroke="#6b7280" stroke-width="3" marker-end="url(#arrowGray)"/>

  <!-- ===== STEP 4: Shortcut ===== -->
  <rect x="705" y="50" width="185" height="210" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="8"/>
  <rect x="705" y="50" width="185" height="28" fill="#ef4444" rx="8"/>
  <rect x="705" y="65" width="185" height="13" fill="#ef4444"/>
  <text x="797" y="70" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    Step 4: Shortcut
  </text>

  <!-- Same 5 vertices -->
  <circle cx="797" cy="110" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="797" y="114" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">A</text>
  <circle cx="735" cy="155" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="735" y="159" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">B</text>
  <circle cx="860" cy="155" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="860" y="159" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">C</text>
  <circle cx="750" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="750" y="224" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">D</text>
  <circle cx="845" cy="220" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="845" y="224" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">E</text>

  <!-- Hamiltonian cycle: A→B→D→E→C→A -->
  <line x1="790" y1="118" x2="742" y2="148" stroke="#ef4444" stroke-width="4" marker-end="url(#arrowRed)"/>
  <line x1="738" y1="163" x2="747" y2="212" stroke="#ef4444" stroke-width="4" marker-end="url(#arrowRed)"/>
  <line x1="758" y1="222" x2="837" y2="222" stroke="#ef4444" stroke-width="4" marker-end="url(#arrowRed)"/>
  <line x1="849" y1="212" x2="856" y2="163" stroke="#ef4444" stroke-width="4" marker-end="url(#arrowRed)"/>
  <line x1="853" y1="148" x2="804" y2="118" stroke="#ef4444" stroke-width="4" marker-end="url(#arrowRed)"/>

  <text x="797" y="248" font-family="Arial" font-size="11" text-anchor="middle" fill="#dc2626">
    Visit each vertex once
  </text>

  <!-- ===== BOTTOM: Algorithm Details from Book ===== -->
  <rect x="15" y="280" width="870" height="230" fill="#fffbeb" stroke="#f59e0b" stroke-width="3" rx="10"/>

  <!-- Algorithm header -->
  <rect x="15" y="280" width="870" height="35" fill="#f59e0b" rx="10"/>
  <rect x="15" y="300" width="870" height="15" fill="#f59e0b"/>
  <text x="450" y="303" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Algorithm 3.7 &#x2014; Metric TSP (Factor 2)  [Vazirani, Ch. 3.2.1]
  </text>

  <!-- Step 1 -->
  <rect x="35" y="328" width="28" height="28" fill="#22c55e" rx="14"/>
  <text x="49" y="347" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">1</text>
  <text x="75" y="348" font-family="Arial" font-size="14" fill="#1f2937">
    Find a <tspan font-weight="bold">Minimum Spanning Tree (MST)</tspan>, T, of graph G.
  </text>
  <text x="75" y="365" font-family="Arial" font-size="11" fill="#6b7280" font-style="italic">
    Lower bound: cost(T) &#x2264; OPT, since deleting any edge of optimal tour gives a spanning tree.
  </text>

  <!-- Step 2 -->
  <rect x="35" y="380" width="28" height="28" fill="#6366f1" rx="14"/>
  <text x="49" y="399" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">2</text>
  <text x="75" y="400" font-family="Arial" font-size="14" fill="#1f2937">
    <tspan font-weight="bold">Double every edge</tspan> of the MST to obtain an Eulerian graph.
  </text>
  <text x="75" y="417" font-family="Arial" font-size="11" fill="#6b7280" font-style="italic">
    Every vertex now has even degree &#x2192; Euler tour guaranteed to exist.
  </text>

  <!-- Step 3 -->
  <rect x="35" y="432" width="28" height="28" fill="#a855f7" rx="14"/>
  <text x="49" y="451" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">3</text>
  <text x="75" y="452" font-family="Arial" font-size="14" fill="#1f2937">
    Find an <tspan font-weight="bold">Euler tour</tspan> of this graph (e.g., via DFS traversal).
  </text>
  <text x="75" y="469" font-family="Arial" font-size="11" fill="#6b7280" font-style="italic">
    Traverse every edge exactly once. Cost of tour = 2 &#xB7; cost(T).
  </text>

  <!-- Step 4 -->
  <rect x="35" y="478" width="28" height="28" fill="#ef4444" rx="14"/>
  <text x="49" y="497" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">4</text>
  <text x="75" y="498" font-family="Arial" font-size="14" fill="#1f2937">
    <tspan font-weight="bold">Shortcut:</tspan> Output the tour visiting vertices in order of first appearance.
  </text>

  <!-- Final result badge -->
  <rect x="610" y="473" width="260" height="32" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="16"/>
  <text x="740" y="494" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">
    &#10004;  cost(C) &#x2264; 2 &#xB7; OPT
  </text>
</svg>
