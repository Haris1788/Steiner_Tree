<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Mapping: Replace Shortcuts with Real Paths, Remove Cycles
  </text>
  
  <!-- Step 1: Shortcut -->
  <text x="130" y="75" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">
    Step 1: Shortcut in G'
  </text>
  
  <circle cx="50" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="50" y="180" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">A</text>
  
  <circle cx="210" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="210" y="180" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">B</text>
  
  <!-- Direct edge -->
  <line x1="62" y1="150" x2="198" y2="150" stroke="#22c55e" stroke-width="4"/>
  <text x="130" y="140" font-family="Arial" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="bold">Direct (cost 10)</text>
  
  <!-- Arrow -->
  <defs>
    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280" />
    </marker>
  </defs>
  <line x1="240" y1="150" x2="280" y2="150" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow6)"/>
  
  <!-- Step 2: Replace with real path -->
  <text x="400" y="75" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">
    Step 2: Replace with Real Path
  </text>
  
  <circle cx="320" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="320" y="180" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">A</text>
  
  <circle cx="480" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="480" y="180" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">B</text>
  
  <!-- Intermediate points -->
  <circle cx="360" cy="120" r="8" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <circle cx="400" cy="110" r="8" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <circle cx="440" cy="120" r="8" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  
  <!-- Zigzag path -->
  <polyline points="332,150 360,120 400,110 440,120 468,150" 
            fill="none" stroke="#ef4444" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="100" font-family="Arial" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="bold">
    Actual path (cost 10)
  </text>
  
  <!-- Arrow -->
  <line x1="510" y1="150" x2="550" y2="150" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow6)"/>
  
  <!-- Step 3: Result -->
  <text x="670" y="75" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">
    Step 3: Result in G
  </text>
  
  <circle cx="590" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="590" y="180" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">A</text>
  
  <circle cx="750" cy="150" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="750" y="180" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">B</text>
  
  <!-- Path with intermediate points -->
  <circle cx="630" cy="120" r="8" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <circle cx="670" cy="110" r="8" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <circle cx="710" cy="120" r="8" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  
  <polyline points="602,150 630,120 670,110 710,120 738,150" 
            fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Step 4: Cycle removal -->
  <text x="400" y="240" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">
    Step 4: If Cycles Appear, Cut to Make a Tree
  </text>
  
  <!-- Before: Graph with cycle -->
  <text x="180" y="275" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">
    Before (with cycle)
  </text>
  
  <circle cx="120" cy="310" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="180" cy="310" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="240" cy="310" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="150" cy="360" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="210" cy="360" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Edges forming cycle -->
  <line x1="130" y1="310" x2="170" y2="310" stroke="#64748b" stroke-width="3"/>
  <line x1="190" y1="310" x2="230" y2="310" stroke="#64748b" stroke-width="3"/>
  <line x1="130" y1="315" x2="145" y2="352" stroke="#64748b" stroke-width="3"/>
  <line x1="155" y1="352" x2="205" y2="352" stroke="#64748b" stroke-width="3"/>
  <line x1="215" y1="355" x2="235" y2="315" stroke="#64748b" stroke-width="3"/>
  
  <!-- Cycle edge (red, to be removed) -->
  <line x1="155" y1="360" x2="205" y2="360" stroke="#ef4444" stroke-width="4" stroke-dasharray="5,5"/>
  <text x="180" y="380" font-family="Arial" font-size="10" text-anchor="middle" fill="#dc2626" font-weight="bold">
    ✂ Remove
  </text>
  
  <!-- Arrow -->
  <line x1="280" y1="330" x2="330" y2="330" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow6)"/>
  
  <!-- After: Tree -->
  <text x="530" y="275" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#22c55e">
    After (tree, cost ≤ before)
  </text>
  
  <circle cx="470" cy="310" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="530" cy="310" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="590" cy="310" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="500" cy="360" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="560" cy="360" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Tree edges (no cycle) -->
  <line x1="480" y1="310" x2="520" y2="310" stroke="#22c55e" stroke-width="3"/>
  <line x1="540" y1="310" x2="580" y2="310" stroke="#22c55e" stroke-width="3"/>
  <line x1="480" y1="315" x2="495" y2="352" stroke="#22c55e" stroke-width="3"/>
  <line x1="545" y1="315" x2="565" y2="352" stroke="#22c55e" stroke-width="3"/>
  
  <text x="530" y="380" font-family="Arial" font-size="10" text-anchor="middle" fill="#16a34a" font-weight="bold">
    ✓ Tree (no cycles)
  </text>
</svg>
