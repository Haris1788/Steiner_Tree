<svg width="600" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    MST with Odd-Degree Vertices Highlighted
  </text>
  
  <!-- MST Graph -->
  <circle cx="150" cy="120" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="150" y="100" font-family="Arial" font-size="11" font-weight="bold" fill="#1e3a8a">A</text>
  <text x="170" y="125" font-family="Arial" font-size="10" fill="#ef4444">deg=3</text>
  
  <circle cx="300" cy="120" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="300" y="100" font-family="Arial" font-size="11" font-weight="bold" fill="#1e3a8a">B</text>
  <text x="320" y="125" font-family="Arial" font-size="10" fill="#15803d">deg=2</text>
  
  <circle cx="450" cy="120" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="450" y="100" font-family="Arial" font-size="11" font-weight="bold" fill="#1e3a8a">C</text>
  <text x="470" y="125" font-family="Arial" font-size="10" fill="#ef4444">deg=1</text>
  
  <circle cx="150" cy="240" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="150" y="265" font-family="Arial" font-size="11" font-weight="bold" fill="#1e3a8a">D</text>
  <text x="170" y="245" font-family="Arial" font-size="10" fill="#ef4444">deg=1</text>
  
  <circle cx="300" cy="240" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="300" y="265" font-family="Arial" font-size="11" font-weight="bold" fill="#1e3a8a">E</text>
  <text x="320" y="245" font-family="Arial" font-size="10" fill="#15803d">deg=2</text>
  
  <circle cx="450" cy="240" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="450" y="265" font-family="Arial" font-size="11" font-weight="bold" fill="#1e3a8a">F</text>
  <text x="470" y="245" font-family="Arial" font-size="10" fill="#ef4444">deg=1</text>
  
  <circle cx="225" cy="180" r="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="225" y="200" font-family="Arial" font-size="11" font-weight="bold" fill="#1e3a8a">G</text>
  <text x="205" y="185" font-family="Arial" font-size="10" fill="#ef4444">deg=3</text>
  
  <!-- MST Edges -->
  <line x1="162" y1="120" x2="288" y2="120" stroke="#22c55e" stroke-width="4"/>
  <line x1="312" y1="120" x2="438" y2="120" stroke="#22c55e" stroke-width="4"/>
  <line x1="150" y1="132" x2="150" y2="228" stroke="#22c55e" stroke-width="4"/>
  <line x1="162" y1="130" x2="213" y2="170" stroke="#22c55e" stroke-width="4"/>
  <line x1="237" y1="180" x2="288" y2="228" stroke="#22c55e" stroke-width="4"/>
  <line x1="312" y1="240" x2="438" y2="240" stroke="#22c55e" stroke-width="4"/>
  
  <!-- Overlay circles on odd-degree vertices -->
  <circle cx="150" cy="120" r="24" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="5,3"/>
  <circle cx="450" cy="120" r="24" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="5,3"/>
  <circle cx="150" cy="240" r="24" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="5,3"/>
  <circle cx="450" cy="240" r="24" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="5,3"/>
  <circle cx="225" cy="180" r="24" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="5,3"/>
  
  <!-- Legend -->
  <rect x="50" y="310" width="500" height="120" fill="#f9fafb" stroke="#6b7280" stroke-width="2" rx="8"/>
  <text x="300" y="335" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">
    Degree Count
  </text>
  
  <circle cx="100" cy="363" r="8" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="368" font-family="Arial" font-size="13" fill="#1f2937">
    <tspan font-weight="bold">Even Degree:</tspan> B(2), E(2) — Total: 2 vertices
  </text>
  
  <circle cx="100" cy="393" r="8" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="398" font-family="Arial" font-size="13" fill="#1f2937">
    <tspan font-weight="bold">Odd Degree:</tspan> A(3), C(1), D(1), F(1), G(3) — Total: 5 vertices
  </text>
  
  <text x="300" y="420" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#6b7280">
    Note: Any MST has an even number of odd-degree vertices
  </text>
</svg>
