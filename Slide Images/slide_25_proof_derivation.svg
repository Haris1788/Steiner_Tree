<svg width="700" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <!-- Title -->
  <text x="350" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Proof: Cost ≤ 2 · OPT
  </text>
  
  <!-- Derivation steps -->
  <rect x="50" y="70" width="600" height="340" fill="#ffffff" stroke="#3b82f6" stroke-width="3" rx="10"/>
  
  <!-- Step 1 -->
  <text x="80" y="110" font-family="Arial" font-size="16" font-weight="bold" fill="#1e40af">
    Step 1: Lower Bound
  </text>
  <rect x="100" y="125" width="500" height="50" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="5"/>
  <text x="350" y="150" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">
    cost(MST) ≤ OPT
  </text>
  <text x="350" y="168" font-family="Arial" font-size="12" text-anchor="middle" fill="#15803d">
    (Removing one edge from optimal tour gives a spanning tree)
  </text>
  
  <!-- Step 2 -->
  <text x="80" y="210" font-family="Arial" font-size="16" font-weight="bold" fill="#1e40af">
    Step 2: Doubling
  </text>
  <rect x="100" y="225" width="500" height="50" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" rx="5"/>
  <text x="350" y="250" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#312e81">
    cost(Euler Tour) = 2 · cost(MST)
  </text>
  <text x="350" y="268" font-family="Arial" font-size="12" text-anchor="middle" fill="#3730a3">
    (Each MST edge is used exactly twice in Euler tour)
  </text>
  
  <!-- Step 3 -->
  <text x="80" y="310" font-family="Arial" font-size="16" font-weight="bold" fill="#1e40af">
    Step 3: Shortcutting (Triangle Inequality)
  </text>
  <rect x="100" y="325" width="500" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="5"/>
  <text x="350" y="350" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">
    cost(Final Tour) ≤ cost(Euler Tour)
  </text>
  <text x="350" y="368" font-family="Arial" font-size="12" text-anchor="middle" fill="#78350f">
    (Shortcutting never increases cost due to triangle inequality)
  </text>
  
  <!-- Final Result -->
  <rect x="100" y="390" width="500" height="20" fill="#dbeafe" rx="3"/>
  <text x="350" y="404" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">
    cost(Final Tour) ≤ cost(Euler Tour) = 2 · cost(MST) ≤ 2 · OPT
  </text>
  
  <!-- Conclusion box -->
  <rect x="150" y="425" width="400" height="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="4"/>
  <text x="350" y="438" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#991b1b">
    Therefore: Cost(Final Tour) ≤ 2 · OPT ✓
  </text>
</svg>
