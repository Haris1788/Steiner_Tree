<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
    <!-- Title -->
  <text x="250" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Comparing Costs: OPT(G') ≤ OPT(G)
  </text>
  
  <!-- Price tag shape for G -->
  <path d="M 80 100 L 200 100 L 220 140 L 200 180 L 80 180 L 80 100" 
        fill="#fecaca" stroke="#dc2626" stroke-width="3"/>
  <circle cx="100" cy="140" r="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  
  <text x="150" y="135" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#7f1d1d">
    Original G
  </text>
  <text x="150" y="160" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#991b1b">
    OPT(G)
  </text>
  
  <!-- Comparison symbol -->
  <text x="250" y="150" font-family="Arial" font-size="36" font-weight="bold" text-anchor="middle" fill="#6b7280">
    ≥
  </text>
  
  <!-- Price tag shape for G' (cheaper/same) -->
  <path d="M 280 100 L 400 100 L 420 140 L 400 180 L 280 180 L 280 100" 
        fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
  <circle cx="300" cy="140" r="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  
  <text x="350" y="135" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532d">
    Metric G'
  </text>
  <text x="350" y="160" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#15803d">
    OPT(G')
  </text>
  
  <!-- "Price Match Guarantee" banner -->
  <rect x="100" y="220" width="300" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" rx="8"/>
  <text x="250" y="243" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e">
    🏷️ Price Match Guarantee
  </text>
  <text x="250" y="262" font-family="Arial" font-size="13" text-anchor="middle" fill="#78350f">
    Metric map always matches or beats the original
  </text>
  
  <!-- Explanation box -->
  <rect x="50" y="290" width="400" height="90" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="250" y="315" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Why?
  </text>
  <text x="250" y="335" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e3a8a">
    Every edge in G' uses the shortest path from G.
  </text>
  <text x="250" y="353" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e3a8a">
    Shortcuts never increase cost (only decrease or stay same).
  </text>
  <text x="250" y="371" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e3a8a">
    Therefore, the optimal solution in G' is ≤ optimal in G.
  </text>
</svg>
