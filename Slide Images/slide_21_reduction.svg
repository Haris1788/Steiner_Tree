<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
    <!--Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Reduction: Transform G into Complete Graph G'
  </text>
  
  <!-- Left: Original Graph G -->
  <text x="200" y="70" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">
    Graph G (with some edges missing)
  </text>
  
  <!-- Vertices -->
  <circle cx="150" cy="150" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="150" y="135" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">v₁</text>
  
  <circle cx="250" cy="150" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="250" y="135" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">v₂</text>
  
  <circle cx="150" cy="250" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="150" y="270" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">v₃</text>
  
  <circle cx="250" cy="250" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="250" y="270" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">v₄</text>
  
  <!-- Existing edges (cost = 1) -->
  <line x1="164" y1="150" x2="236" y2="150" stroke="#22c55e" stroke-width="4"/>
  <text x="200" y="145" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#16a34a">1</text>
  
  <line x1="150" y1="164" x2="150" y2="236" stroke="#22c55e" stroke-width="4"/>
  <text x="135" y="205" font-family="Arial" font-size="11" font-weight="bold" fill="#16a34a">1</text>
  
  <line x1="250" y1="164" x2="250" y2="236" stroke="#22c55e" stroke-width="4"/>
  <text x="265" y="205" font-family="Arial" font-size="11" font-weight="bold" fill="#16a34a">1</text>
  
  <!-- Missing edges (none drawn initially) -->
  <line x1="164" y1="164" x2="236" y2="236" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="164" y1="236" x2="236" y2="164" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="164" y1="250" x2="236" y2="250" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="5,5"/>
  
  <text x="200" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#6b7280">
    Some edges missing in G
  </text>
  
  <!-- Arrow -->
  <defs>
    <marker id="arrow10" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280" />
    </marker>
  </defs>
  <line x1="300" y1="200" x2="370" y2="200" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow10)"/>
  <text x="335" y="190" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">
    Assign Costs
  </text>
  
  <!-- Right: Complete Graph G' -->
  <text x="600" y="70" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">
    Complete Graph G' (all edges added)
  </text>
  
  <!-- Vertices -->
  <circle cx="550" cy="150" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="550" y="135" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">v₁</text>
  
  <circle cx="650" cy="150" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="650" y="135" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">v₂</text>
  
  <circle cx="550" cy="250" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="550" y="270" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">v₃</text>
  
  <circle cx="650" cy="250" r="14" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="650" y="270" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">v₄</text>
  
  <!-- Existing edges (cost = 1, thin green) -->
  <line x1="564" y1="150" x2="636" y2="150" stroke="#22c55e" stroke-width="3"/>
  <text x="600" y="145" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#16a34a">1</text>
  
  <line x1="550" y1="164" x2="550" y2="236" stroke="#22c55e" stroke-width="3"/>
  <text x="535" y="205" font-family="Arial" font-size="10" font-weight="bold" fill="#16a34a">1</text>
  
  <line x1="650" y1="164" x2="650" y2="236" stroke="#22c55e" stroke-width="3"/>
  <text x="665" y="205" font-family="Arial" font-size="10" font-weight="bold" fill="#16a34a">1</text>
  
  <!-- Missing edges (now EXPENSIVE, thick red) -->
  <line x1="564" y1="164" x2="636" y2="236" stroke="#ef4444" stroke-width="6"/>
  <text x="615" y="195" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#dc2626">α(n)·n</text>
  
  <line x1="564" y1="236" x2="636" y2="164" stroke="#ef4444" stroke-width="6"/>
  <text x="585" y="195" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#dc2626">α(n)·n</text>
  
  <line x1="564" y1="250" x2="636" y2="250" stroke="#ef4444" stroke-width="6"/>
  <text x="600" y="267" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#dc2626">α(n)·n</text>
  
  <text x="600" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="bold">
    Missing edges = HUGE cost
  </text>
  
  <!-- Legend boxes -->
  <rect x="100" y="340" width="280" height="95" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="5"/>
  <line x1="120" y1="365" x2="160" y2="365" stroke="#22c55e" stroke-width="4"/>
  <text x="170" y="370" font-family="Arial" font-size="13" fill="#14532d" font-weight="bold">
    Edge exists in G
  </text>
  <text x="120" y="390" font-family="Arial" font-size="12" fill="#15803d">
    Cost = 1 (cheap)
  </text>
  <text x="120" y="408" font-family="Arial" font-size="11" fill="#15803d">
    These edges were in the original graph
  </text>
  <text x="120" y="425" font-family="Arial" font-size="11" fill="#15803d">
    and have normal cost
  </text>
  
  <rect x="420" y="340" width="280" height="95" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="5"/>
  <line x1="440" y1="365" x2="480" y2="365" stroke="#ef4444" stroke-width="6"/>
  <text x="490" y="370" font-family="Arial" font-size="13" fill="#7f1d1d" font-weight="bold">
    Edge NOT in G
  </text>
  <text x="440" y="390" font-family="Arial" font-size="12" fill="#991b1b">
    Cost = α(n) · n (HUGE!)
  </text>
  <text x="440" y="408" font-family="Arial" font-size="11" fill="#991b1b">
    These edges are artificially added with
  </text>
  <text x="440" y="425" font-family="Arial" font-size="11" fill="#991b1b">
    enormous cost to make graph complete
  </text>
</svg>
