<svg width="900" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <!-- Title -->
  <text x="450" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Doubling Edges and Creating Euler Tour
  </text>
  
  <!-- Step 1: Original Tree -->
  <text x="150" y="70" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">
    1. Optimal Steiner Tree
  </text>
  
  <circle cx="150" cy="120" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="100" cy="180" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="200" cy="180" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="80" cy="240" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="120" cy="240" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="180" cy="240" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="220" cy="240" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Tree edges -->
  <line x1="150" y1="130" x2="100" y2="170" stroke="#22c55e" stroke-width="3"/>
  <line x1="150" y1="130" x2="200" y2="170" stroke="#22c55e" stroke-width="3"/>
  <line x1="100" y1="190" x2="80" y2="230" stroke="#22c55e" stroke-width="3"/>
  <line x1="100" y1="190" x2="120" y2="230" stroke="#22c55e" stroke-width="3"/>
  <line x1="200" y1="190" x2="180" y2="230" stroke="#22c55e" stroke-width="3"/>
  <line x1="200" y1="190" x2="220" y2="230" stroke="#22c55e" stroke-width="3"/>
  
  <text x="150" y="280" font-family="Arial" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="bold">
    Cost = OPT
  </text>
  
  <!-- Arrow -->
  <defs>
    <marker id="arrow8" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280" />
    </marker>
  </defs>
  <line x1="250" y1="180" x2="290" y2="180" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow8)"/>
  
  <!-- Step 2: Doubled Edges -->
  <text x="450" y="70" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">
    2. Double Every Edge
  </text>
  
  <circle cx="450" cy="120" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="400" cy="180" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="500" cy="180" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="380" cy="240" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="420" cy="240" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="480" cy="240" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="520" cy="240" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Doubled edges (parallel lines) -->
  <line x1="447" y1="130" x2="397" y2="170" stroke="#6366f1" stroke-width="3"/>
  <line x1="453" y1="130" x2="403" y2="170" stroke="#6366f1" stroke-width="3"/>
  <line x1="447" y1="130" x2="497" y2="170" stroke="#6366f1" stroke-width="3"/>
  <line x1="453" y1="130" x2="503" y2="170" stroke="#6366f1" stroke-width="3"/>
  <line x1="397" y1="190" x2="377" y2="230" stroke="#6366f1" stroke-width="3"/>
  <line x1="403" y1="190" x2="383" y2="230" stroke="#6366f1" stroke-width="3"/>
  <line x1="397" y1="190" x2="417" y2="230" stroke="#6366f1" stroke-width="3"/>
  <line x1="403" y1="190" x2="423" y2="230" stroke="#6366f1" stroke-width="3"/>
  <line x1="497" y1="190" x2="477" y2="230" stroke="#6366f1" stroke-width="3"/>
  <line x1="503" y1="190" x2="483" y2="230" stroke="#6366f1" stroke-width="3"/>
  <line x1="497" y1="190" x2="517" y2="230" stroke="#6366f1" stroke-width="3"/>
  <line x1="503" y1="190" x2="523" y2="230" stroke="#6366f1" stroke-width="3"/>
  
  <text x="450" y="280" font-family="Arial" font-size="12" text-anchor="middle" fill="#4338ca" font-weight="bold">
    Cost = 2 · OPT
  </text>
  <text x="450" y="297" font-family="Arial" font-size="11" text-anchor="middle" fill="#4338ca">
    (Eulerian: all degrees even)
  </text>
  
  <!-- Arrow -->
  <line x1="550" y1="180" x2="590" y2="180" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow8)"/>
  
  <!-- Step 3: Euler Tour -->
  <text x="750" y="70" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">
    3. Euler Tour (DFS)
  </text>
  
  <circle cx="750" cy="120" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="700" cy="180" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="800" cy="180" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="680" cy="240" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="720" cy="240" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="780" cy="240" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <circle cx="820" cy="240" r="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Edges (same as doubled) -->
  <line x1="747" y1="130" x2="697" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <line x1="753" y1="130" x2="703" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <line x1="747" y1="130" x2="797" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <line x1="753" y1="130" x2="803" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <line x1="697" y1="190" x2="677" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="703" y1="190" x2="683" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="697" y1="190" x2="717" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="703" y1="190" x2="723" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="797" y1="190" x2="777" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="803" y1="190" x2="783" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="797" y1="190" x2="817" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="803" y1="190" x2="823" y2="230" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Tour path (dotted arrows showing order) -->
  <path d="M 750 120 L 700 180 L 680 240 L 700 180 L 720 240 L 700 180 L 750 120 L 800 180 L 780 240 L 800 180 L 820 240 L 800 180 L 750 120" 
        fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrow8)"/>
  
  <text x="750" y="280" font-family="Arial" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="bold">
    Tour visits every edge
  </text>
  <text x="750" y="297" font-family="Arial" font-size="11" text-anchor="middle" fill="#dc2626">
    exactly once
  </text>
  
  <!-- Bottom explanation -->
  <rect x="50" y="330" width="800" height="50" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="5"/>
  <text x="450" y="353" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Key Insight: Doubling edges makes graph Eulerian (all vertices have even degree)
  </text>
  <text x="450" y="371" font-family="Arial" font-size="12" text-anchor="middle" fill="#1e3a8a">
    This allows us to find a tour that visits every edge exactly once, with cost = 2 · OPT
  </text>
</svg>
