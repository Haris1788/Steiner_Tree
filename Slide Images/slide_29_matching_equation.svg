<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Matching Cost Bound
  </text>
  
  <!-- Main equation box -->
  <rect x="100" y="80" width="400" height="100" fill="#ffffff" stroke="#8b5cf6" stroke-width="4" rx="10"/>
  
  <!-- Equation -->
  <text x="300" y="130" font-family="Arial" font-size="32" font-weight="bold" text-anchor="middle" fill="#5b21b6">
    cost(M) ≤ 0.5 · OPT
  </text>
  
  <!-- Explanation -->
  <text x="300" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#6d28d9">
    Matching cost is at most half the optimal tour cost
  </text>
  
  <!-- Bottom description -->
  <rect x="80" y="205" width="440" height="80" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2" rx="8"/>
  <text x="300" y="230" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#5b21b6">
    Key Insight
  </text>
  <text x="300" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="#6d28d9">
    The optimal TSP tour visits odd-degree vertices and forms a cycle.
  </text>
  <text x="300" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#6d28d9">
    This cycle can be split into 2 matchings, so one matching costs ≤ OPT/2.
  </text>
</svg>
