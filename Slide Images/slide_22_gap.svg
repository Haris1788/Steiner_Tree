<svg width="900" height="580" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580">
  <defs>
    <marker id="arrowTour" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
    <marker id="arrowGap" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="32" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e40af">
    The Gap: Why General TSP Cannot Be Approximated (Theorem 3.6)
  </text>

  <!-- =============== CASE 1: HC EXISTS (Left) =============== -->
  <rect x="20" y="50" width="400" height="280" fill="#f0fdf4" stroke="#22c55e" stroke-width="3" rx="10"/>
  <rect x="20" y="50" width="400" height="32" fill="#22c55e" rx="10"/>
  <rect x="20" y="68" width="400" height="14" fill="#22c55e"/>
  <text x="220" y="72" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
    Case 1: Hamiltonian Cycle Exists
  </text>

  <!-- Graph G with HC: 5 vertices in pentagon, all edges cost 1 -->
  <text x="155" y="105" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">
    Graph G (has HC)
  </text>

  <!-- Pentagon vertices -->
  <circle cx="155" cy="140" r="11" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="155" y="144" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">1</text>
  <circle cx="105" cy="175" r="11" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="105" y="179" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">2</text>
  <circle cx="120" cy="225" r="11" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="120" y="229" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">3</text>
  <circle cx="190" cy="225" r="11" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="190" y="229" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">4</text>
  <circle cx="205" cy="175" r="11" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="205" y="179" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">5</text>

  <!-- HC edges (green, cost 1) -->
  <line x1="145" y1="148" x2="110" y2="167" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowTour)"/>
  <line x1="100" y1="184" x2="114" y2="217" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowTour)"/>
  <line x1="131" y1="227" x2="179" y2="227" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowTour)"/>
  <line x1="198" y1="217" x2="210" y2="184" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowTour)"/>
  <line x1="200" y1="167" x2="165" y2="148" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowTour)"/>

  <!-- Cost labels on edges -->
  <text x="118" y="152" font-family="Arial" font-size="10" fill="#16a34a" font-weight="bold">1</text>
  <text x="96" y="202" font-family="Arial" font-size="10" fill="#16a34a" font-weight="bold">1</text>
  <text x="155" y="242" font-family="Arial" font-size="10" fill="#16a34a" font-weight="bold">1</text>
  <text x="210" y="202" font-family="Arial" font-size="10" fill="#16a34a" font-weight="bold">1</text>
  <text x="188" y="152" font-family="Arial" font-size="10" fill="#16a34a" font-weight="bold">1</text>

  <!-- Arrow to G' -->
  <text x="268" y="105" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">
    G' (complete, weighted)
  </text>

  <!-- G' transform arrow -->
  <line x1="220" y1="185" x2="245" y2="185" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="233" y="178" font-family="Arial" font-size="9" fill="#6b7280">&#x2192;</text>

  <!-- G' small complete graph indication -->
  <text x="310" y="145" font-family="Arial" font-size="11" fill="#374151">
    Edges of G &#x2192; cost 1
  </text>
  <text x="310" y="165" font-family="Arial" font-size="11" fill="#374151">
    Non-edges &#x2192; cost &#x03B1;(n)&#xB7;n
  </text>

  <!-- Result box -->
  <rect x="265" y="190" width="140" height="55" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="8"/>
  <text x="335" y="210" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">
    Tour uses only
  </text>
  <text x="335" y="228" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">
    "1" edges
  </text>

  <!-- Total cost -->
  <rect x="60" y="265" width="330" height="50" fill="#d1fae5" stroke="#16a34a" stroke-width="3" rx="8"/>
  <text x="225" y="287" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532d">
    Total Cost = n
  </text>
  <text x="225" y="307" font-family="Arial" font-size="12" text-anchor="middle" fill="#15803d">
    (n edges &#xD7; cost 1 each)
  </text>

  <!-- =============== CASE 2: NO HC (Right) =============== -->
  <rect x="480" y="50" width="400" height="280" fill="#fef2f2" stroke="#ef4444" stroke-width="3" rx="10"/>
  <rect x="480" y="50" width="400" height="32" fill="#ef4444" rx="10"/>
  <rect x="480" y="68" width="400" height="14" fill="#ef4444"/>
  <text x="680" y="72" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
    Case 2: No Hamiltonian Cycle
  </text>

  <!-- Graph G without HC: 5 vertices, missing an edge -->
  <text x="590" y="105" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">
    Graph G (no HC)
  </text>

  <!-- Pentagon vertices -->
  <circle cx="590" cy="140" r="11" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="590" y="144" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">1</text>
  <circle cx="540" cy="175" r="11" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="540" y="179" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">2</text>
  <circle cx="555" cy="225" r="11" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="555" y="229" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">3</text>
  <circle cx="625" cy="225" r="11" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="625" y="229" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">4</text>
  <circle cx="640" cy="175" r="11" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="640" y="179" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">5</text>

  <!-- Existing edges (gray) -->
  <line x1="580" y1="148" x2="545" y2="167" stroke="#9ca3af" stroke-width="2"/>
  <line x1="535" y1="184" x2="549" y2="217" stroke="#9ca3af" stroke-width="2"/>
  <line x1="566" y1="227" x2="614" y2="227" stroke="#9ca3af" stroke-width="2"/>
  <!-- Missing edge 4→5 shown as red X dashed -->
  <line x1="633" y1="217" x2="645" y2="184" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,4"/>
  <text x="648" y="198" font-family="Arial" font-size="16" fill="#ef4444" font-weight="bold">&#x2717;</text>

  <line x1="635" y1="167" x2="600" y2="148" stroke="#9ca3af" stroke-width="2"/>

  <!-- G' info -->
  <text x="770" y="105" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">
    G' (complete, weighted)
  </text>

  <line x1="655" y1="185" x2="680" y2="185" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="668" y="178" font-family="Arial" font-size="9" fill="#6b7280">&#x2192;</text>

  <text x="730" y="145" font-family="Arial" font-size="11" fill="#374151">
    Edges of G &#x2192; cost 1
  </text>
  <text x="730" y="165" font-family="Arial" font-size="11" fill="#ef4444" font-weight="bold">
    Missing edge &#x2192; cost &#x03B1;(n)&#xB7;n
  </text>

  <!-- Result box -->
  <rect x="710" y="190" width="155" height="55" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="8"/>
  <text x="787" y="210" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f1d1d">
    Tour MUST use
  </text>
  <text x="787" y="228" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f1d1d">
    a missing edge!
  </text>

  <!-- Total cost -->
  <rect x="520" y="265" width="330" height="50" fill="#fecaca" stroke="#dc2626" stroke-width="3" rx="8"/>
  <text x="685" y="287" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#7f1d1d">
    Total Cost &gt; &#x03B1;(n) &#xB7; n
  </text>
  <text x="685" y="307" font-family="Arial" font-size="12" text-anchor="middle" fill="#991b1b">
    (&#x03B1;(n) can be ANY polynomial!)
  </text>

  <!-- =============== GAP BAR CHART (Center Bottom) =============== -->
  <rect x="100" y="345" width="700" height="155" fill="#fffbeb" stroke="#f59e0b" stroke-width="3" rx="10"/>

  <text x="450" y="372" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e">
    The Unbridgeable Gap
  </text>

  <!-- Y-axis -->
  <line x1="200" y1="390" x2="200" y2="485" stroke="#374151" stroke-width="2"/>
  <text x="185" y="392" font-family="Arial" font-size="10" text-anchor="end" fill="#374151">Cost</text>

  <!-- Y tick: n -->
  <line x1="195" y1="470" x2="205" y2="470" stroke="#374151" stroke-width="1"/>
  <text x="190" y="474" font-family="Arial" font-size="10" text-anchor="end" fill="#374151">n</text>

  <!-- Y tick: alpha(n)*n -->
  <line x1="195" y1="400" x2="205" y2="400" stroke="#374151" stroke-width="1"/>
  <text x="190" y="404" font-family="Arial" font-size="10" text-anchor="end" fill="#ef4444">&#x03B1;(n)&#xB7;n</text>

  <!-- Bar 1: Cost = n (green, short) -->
  <rect x="260" y="460" width="100" height="20" fill="#22c55e" stroke="#16a34a" stroke-width="2" rx="3"/>
  <text x="310" y="475" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">n</text>
  <text x="310" y="495" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#16a34a">
    HC exists
  </text>

  <!-- Bar 2: Cost > alpha(n)*n (red, tall) -->
  <rect x="540" y="395" width="100" height="85" fill="#ef4444" stroke="#dc2626" stroke-width="2" rx="3"/>
  <text x="590" y="442" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="white">&gt; &#x03B1;(n)&#xB7;n</text>
  <text x="590" y="495" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#dc2626">
    No HC
  </text>

  <!-- Gap arrow between bars -->
  <line x1="430" y1="468" x2="430" y2="402" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6,3"/>
  <polygon points="425,405 430,395 435,405" fill="#f59e0b"/>
  <polygon points="425,465 430,475 435,465" fill="#f59e0b"/>

  <rect x="395" y="425" width="70" height="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="6"/>
  <text x="430" y="444" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400e">
    GAP
  </text>

  <!-- =============== CONCLUSION =============== -->
  <rect x="50" y="515" width="800" height="55" fill="#eff6ff" stroke="#1e40af" stroke-width="3" rx="10"/>
  <text x="450" y="540" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Conclusion: Any &#x03B1;(n)-approximation algorithm would distinguish these cases,
  </text>
  <text x="450" y="560" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">
    thereby solving the NP-hard Hamiltonian Cycle problem &#x2192; Contradiction!
  </text>
</svg>
